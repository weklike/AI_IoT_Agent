services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports: ["127.0.0.1:${MQTT_PUBLISH_PORT:-1883}:1883"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "health", "-m", "ready"]
      interval: 2s
      timeout: 2s
      retries: 10
  backend:
    image: ${BACKEND_IMAGE:-charge-ops-backend:local}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: sqlite+aiosqlite:////data/charge_ops.db
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-charge/v1}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-2}
      FRESH_SAMPLE_MAX_AGE_SECONDS: ${FRESH_SAMPLE_MAX_AGE_SECONDS:-10}
      OFFLINE_TIMEOUT_SECONDS: ${OFFLINE_TIMEOUT_SECONDS:-15}
      OVERHEAT_THRESHOLD_C: ${OVERHEAT_THRESHOLD_C:-60}
      SCENARIO_ACK_TIMEOUT_SECONDS: ${SCENARIO_ACK_TIMEOUT_SECONDS:-5}
      DB_BUSY_TIMEOUT_MS: ${DB_BUSY_TIMEOUT_MS:-1000}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-20}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-3}
      AGENT_TOTAL_TIMEOUT_SECONDS: ${AGENT_TOTAL_TIMEOUT_SECONDS:-90}
      AGENT_CLEANUP_TIMEOUT_SECONDS: ${AGENT_CLEANUP_TIMEOUT_SECONDS:-5}
      AGENT_MAX_MODEL_REQUESTS: ${AGENT_MAX_MODEL_REQUESTS:-6}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      LLM_MODE: ${LLM_MODE:-fixture}
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-${LLM_BASE_URL:-}}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports: ["127.0.0.1:${BACKEND_PUBLISH_PORT:-8000}:8000"]
    volumes: ["backend_data:/data"]
    depends_on:
      mqtt: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  simulator:
    image: ${BACKEND_IMAGE:-charge-ops-backend:local}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    command: ["/app/.venv/bin/python", "-m", "simulator.main"]
    environment:
      SIMULATOR_MODE: ${SIMULATOR_MODE:-legacy}
      SIMULATOR_STATE_DIR: /simulator-state
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-2}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-charge/v1}
    volumes: ["simulator_state:/simulator-state"]
    depends_on:
      mqtt: {condition: service_healthy}
  frontend:
    image: ${FRONTEND_IMAGE:-charge-ops-frontend:local}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports: ["127.0.0.1:${FRONTEND_PUBLISH_PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  backend_data:
  simulator_state:
